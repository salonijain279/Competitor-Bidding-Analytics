[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "competitor-bidding-analytics"
version = "0.1.0"
description = "Client-neutral competitor and margin analytics for sealed-bid markets"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<3.0"]

[tool.setuptools.packages.find]
where = ["src"]
